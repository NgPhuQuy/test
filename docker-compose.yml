name: eeasy

x-service-env: &service-common-env
  TZ: ${TZ:-Asia/Ho_Chi_Minh}
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
  JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Duser.timezone=Asia/Ho_Chi_Minh}
  CORRELATION_ID_HEADER: X-Correlation-Id
  JWT_PUBLIC_KEY_BASE64: ${JWT_PUBLIC_KEY_BASE64:-}
  JWT_ISSUER: ${JWT_ISSUER:-eeasyshopping-auth}

x-service-healthcheck: &service-healthcheck
  test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
  interval: 15s
  timeout: 5s
  start_period: 45s
  retries: 5

services:
  # =========================================================================
  # Tier 0: Infrastructure (MySQL 8.4 + MinIO)
  # =========================================================================
  mysql:
    image: mysql:8.4
    container_name: eeasy-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+07:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD}
      DB_SHOP_PASSWORD: ${DB_SHOP_PASSWORD}
      DB_CART_PASSWORD: ${DB_CART_PASSWORD}
      DB_ORDER_PASSWORD: ${DB_ORDER_PASSWORD}
      DB_PAYMENT_PASSWORD: ${DB_PAYMENT_PASSWORD}
      DB_NOTIFICATION_PASSWORD: ${DB_NOTIFICATION_PASSWORD}
      DB_AUDIT_PASSWORD: ${DB_AUDIT_PASSWORD}
    volumes:
      - eeasy_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - eeasy-data-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: eeasy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - eeasy_minio_data:/data
    networks:
      - eeasy-app-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    container_name: eeasy-minio-init
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-eeasyshopping-media}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET_MEDIA"
        mc anonymous set download "local/$$S3_BUCKET_MEDIA"
    networks:
      - eeasy-app-net

  # =========================================================================
  # Tier 1: Leaf Services (Auth, Payment, Notification, Audit)
  # =========================================================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: ../../docker/Dockerfile.template
    container_name: eeasy-auth
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      <<: *service-common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh"
      SPRING_DATASOURCE_USERNAME: auth_user
      SPRING_DATASOURCE_PASSWORD: ${DB_AUTH_PASSWORD}
      JWT_PRIVATE_KEY_BASE64: ${JWT_PRIVATE_KEY_BASE64:-}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      JWT_REFRESH_TOKEN_TTL_SECONDS: ${JWT_REFRESH_TOKEN_TTL_SECONDS:-604800}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_TOKEN_URI: ${GOOGLE_TOKEN_URI:-https://oauth2.googleapis.com/token}
      GOOGLE_JWK_SET_URI: ${GOOGLE_JWK_SET_URI:-https://www.googleapis.com/oauth2/v3/certs}
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      AUDIT_SERVICE_URL: http://audit-service:8080
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eeasy-app-net
      - eeasy-data-net
    healthcheck: *service-healthcheck

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: ../../docker/Dockerfile.template
    container_name: eeasy-payment
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      <<: *service-common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh"
      SPRING_DATASOURCE_USERNAME: payment_user
      SPRING_DATASOURCE_PASSWORD: ${DB_PAYMENT_PASSWORD}
      ORDER_SERVICE_URL: http://order-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      AUDIT_SERVICE_URL: http://audit-service:8080
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_API_URL: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eeasy-app-net
      - eeasy-data-net
    healthcheck: *service-healthcheck

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: ../../docker/Dockerfile.template
    container_name: eeasy-notification
    restart: unless-stopped
    ports:
      - "127.0.0.1:8086:8080"
    environment:
      <<: *service-common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh"
      SPRING_DATASOURCE_USERNAME: notification_user
      SPRING_DATASOURCE_PASSWORD: ${DB_NOTIFICATION_PASSWORD}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      FCM_ENABLED: ${FCM_ENABLED:-false}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eeasy-app-net
      - eeasy-data-net
    healthcheck: *service-healthcheck

  audit-service:
    build:
      context: ./services/audit-service
      dockerfile: ../../docker/Dockerfile.template
    container_name: eeasy-audit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:8080"
    environment:
      <<: *service-common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/audit_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh"
      SPRING_DATASOURCE_USERNAME: audit_user
      SPRING_DATASOURCE_PASSWORD: ${DB_AUDIT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - eeasy-app-net
      - eeasy-data-net
    healthcheck: *service-healthcheck

  # =========================================================================
  # Tier 2: Shop Service (owns Shop, Product, SKU, Inventory, Category)
  # =========================================================================
  shop-service:
    build:
      context: ./services/shop-service
      dockerfile: ../../docker/Dockerfile.template
    container_name: eeasy-shop
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      <<: *service-common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/shop_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh"
      SPRING_DATASOURCE_USERNAME: shop_user
      SPRING_DATASOURCE_PASSWORD: ${DB_SHOP_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8080
      AUDIT_SERVICE_URL: http://audit-service:8080
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-http://localhost:9000/eeasyshopping-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-eeasyshopping-media}
      S3_REGION: auto
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    networks:
      - eeasy-app-net
      - eeasy-data-net
    healthcheck: *service-healthcheck

  # =========================================================================
  # Tier 3: Cart Service
  # =========================================================================
  cart-service:
    build:
      context: ./services/cart-service
      dockerfile: ../../docker/Dockerfile.template
    container_name: eeasy-cart
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      <<: *service-common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/cart_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh"
      SPRING_DATASOURCE_USERNAME: cart_user
      SPRING_DATASOURCE_PASSWORD: ${DB_CART_PASSWORD}
      SHOP_SERVICE_URL: http://shop-service:8080
    depends_on:
      mysql:
        condition: service_healthy
      shop-service:
        condition: service_healthy
    networks:
      - eeasy-app-net
      - eeasy-data-net
    healthcheck: *service-healthcheck

  # =========================================================================
  # Tier 4: Order Service
  # =========================================================================
  order-service:
    build:
      context: ./services/order-service
      dockerfile: ../../docker/Dockerfile.template
    container_name: eeasy-order
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:8080"
    environment:
      <<: *service-common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh"
      SPRING_DATASOURCE_USERNAME: order_user
      SPRING_DATASOURCE_PASSWORD: ${DB_ORDER_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:8080
      SHOP_SERVICE_URL: http://shop-service:8080
      CART_SERVICE_URL: http://cart-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      AUDIT_SERVICE_URL: http://audit-service:8080
      RESERVATION_TTL_MINUTES: ${RESERVATION_TTL_MINUTES:-15}
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      shop-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    networks:
      - eeasy-app-net
      - eeasy-data-net
    healthcheck: *service-healthcheck

  # =========================================================================
  # Tier 5: API Gateway (Single Entry Point, no DB network access)
  # =========================================================================
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: ../../docker/Dockerfile.template
    container_name: eeasy-gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      <<: *service-common-env
      AUTH_SERVICE_URL: http://auth-service:8080
      SHOP_SERVICE_URL: http://shop-service:8080
      CART_SERVICE_URL: http://cart-service:8080
      ORDER_SERVICE_URL: http://order-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      AUDIT_SERVICE_URL: http://audit-service:8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      auth-service:
        condition: service_healthy
      shop-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
    networks:
      - eeasy-app-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

networks:
  eeasy-app-net:
    driver: bridge

  eeasy-data-net:
    driver: bridge
    internal: true

volumes:
  eeasy_mysql_data:
  eeasy_minio_data:
